[package]
name = "cnokhwa"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies.nokhwa]
version = "0.10.11"
features = ["input-native", "output-threaded"]

[dependencies]
dcv-color-primitives = "1.0.0"
parking_lot = "0.13.0"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa-bindings-linux = "=0.1.4"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa-bindings-windows = "0.4.6"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
nokhwa-bindings-macos = "0.2.4"

[patch.crates-io]
nokhwa-bindings-linux = { path = "vendor/nokhwa-bindings-linux" }

[profile.release.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
